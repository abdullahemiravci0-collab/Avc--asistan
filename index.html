<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ya Öl Ya Öldür - Mobil</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; overflow: hidden; background: #000; font-family: Arial, sans-serif; touch-action: none; user-select: none; }
  canvas { display: block; }

  #hud {
    position: fixed; top: 10px; left: 10px; color: #fff;
    font-size: 16px; text-shadow: 2px 2px 4px #000; z-index: 10; pointer-events: none;
  }

  /* Joystick */
  #joyBase {
    position: fixed; bottom: 30px; left: 30px;
    width: 130px; height: 130px; border-radius: 50%;
    background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.4);
    z-index: 20;
  }
  #joyKnob {
    position: absolute; top: 50%; left: 50%;
    width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%;
    background: rgba(255,255,255,0.5);
  }

  /* Ateş butonu */
  #fireBtn {
    position: fixed; bottom: 40px; right: 30px;
    width: 90px; height: 90px; border-radius: 50%;
    background: rgba(220,50,50,0.7); border: 3px solid rgba(255,255,255,0.6);
    color: #fff; font-size: 14px; font-weight: bold; z-index: 20;
    display: flex; align-items: center; justify-content: center;
  }
  #fireBtn:active { background: rgba(255,80,80,0.9); }

  /* Kanca butonu */
  #hookBtn {
    position: fixed; bottom: 150px; right: 40px;
    width: 70px; height: 70px; border-radius: 50%;
    background: rgba(50,120,220,0.7); border: 3px solid rgba(255,255,255,0.6);
    color: #fff; font-size: 12px; font-weight: bold; z-index: 20;
    display: flex; align-items: center; justify-content: center;
  }
  #hookBtn:active { background: rgba(80,150,255,0.9); }

  #startScreen {
    position: fixed; inset: 0; background: rgba(0,0,0,0.9); color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 100; text-align: center; padding: 20px;
  }
  #startScreen h1 { color: #e33; font-size: 36px; margin: 0 0 15px; }
  #startScreen p { max-width: 400px; line-height: 1.7; color: #ccc; font-size: 15px; }
  #startBtn {
    margin-top: 25px; padding: 16px 50px; font-size: 20px; background: #e33;
    color: #fff; border: none; border-radius: 10px;
  }
  #gameOver {
    position: fixed; inset: 0; background: rgba(0,0,0,0.92); color: #fff;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    z-index: 100;
  }
  #gameOver h1 { color: #e33; font-size: 44px; }
  #restartBtn {
    padding: 16px 50px; font-size: 20px; background: #e33; color: #fff;
    border: none; border-radius: 10px; margin-top: 20px;
  }
</style>
</head>
<body>

<div id="hud">
  ❤️ <span id="hp">100</span> | 💀 <span id="score">0</span>
</div>

<div id="joyBase"><div id="joyKnob"></div></div>
<div id="fireBtn">ATEŞ</div>
<div id="hookBtn">KANCA</div>

<div id="startScreen">
  <h1>YA ÖL YA ÖLDÜR</h1>
  <p>
    Sol joystick = hareket<br>
    Sağ tarafta parmağını kaydır = bakın<br>
    Kırmızı buton = ateş<br>
    Mavi buton = kanca (binaya tutun, uç!)
  </p>
  <button id="startBtn">OYUNA BAŞLA</button>
</div>

<div id="gameOver">
  <h1>ÖLDÜN</h1>
  <p>Skor: <span id="finalScore">0</span></p>
  <button id="restartBtn">TEKRAR DENE</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ---------- SAHNE ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
scene.fog = new THREE.Fog(0x1a1a2e, 25, 90);

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 300);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- IŞIK ----------
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const sun = new THREE.DirectionalLight(0x99aaff, 0.9);
sun.position.set(15, 25, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -50;
sun.shadow.camera.right = 50;
sun.shadow.camera.top = 50;
sun.shadow.camera.bottom = -50;
scene.add(sun);

// ---------- ZEMİN ----------
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(120, 120),
  new THREE.MeshStandardMaterial({ color: 0x223322 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// ---------- BİNALAR ----------
const buildings = [];
const buildingMat = new THREE.MeshStandardMaterial({ color: 0x444455 });
for (let i = 0; i < 14; i++) {
  const w = 3 + Math.random()*4;
  const h = 5 + Math.random()*12;
  const d = 3 + Math.random()*4;
  const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), buildingMat);
  const angle = Math.random() * Math.PI * 2;
  const r = 12 + Math.random() * 30;
  b.position.set(Math.cos(angle)*r, h/2, Math.sin(angle)*r);
  b.castShadow = true;
  b.receiveShadow = true;
  b.userData.size = new THREE.Vector3(w, h, d);
  scene.add(b);
  buildings.push(b);
}

// ---------- OYUNCU (3. şahıs) ----------
const playerMesh = new THREE.Group();
const body = new THREE.Mesh(
  new THREE.BoxGeometry(0.7, 1.2, 0.5),
  new THREE.MeshStandardMaterial({ color: 0x3366cc })
);
body.position.y = 0.9;
body.castShadow = true;
playerMesh.add(body);
const head = new THREE.Mesh(
  new THREE.SphereGeometry(0.35, 12, 12),
  new THREE.MeshStandardMaterial({ color: 0xffcc99 })
);
head.position.y = 1.8;
head.castShadow = true;
playerMesh.add(head);
// Silah (sağ elde)
const gunMesh = new THREE.Mesh(
  new THREE.BoxGeometry(0.15, 0.15, 0.7),
  new THREE.MeshStandardMaterial({ color: 0x222222 })
);
gunMesh.position.set(0.4, 1.2, -0.4);
playerMesh.add(gunMesh);
scene.add(playerMesh);

const player = {
  pos: new THREE.Vector3(0, 0, 0),
  yaw: 0,
  pitch: 0,
  hp: 100,
  velY: 0,
  onGround: true,
  speed: 7
};

// ---------- ZOMBİLER ----------
const zombies = [];
const zombieBodyMat = new THREE.MeshStandardMaterial({ color: 0x2e8b2e });
const zombieHeadMat = new THREE.MeshStandardMaterial({ color: 0x3fa03f });

function spawnZombie() {
  const g = new THREE.Group();
  const b = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.2, 0.5), zombieBodyMat);
  b.position.y = 0.9; b.castShadow = true; g.add(b);
  const h = new THREE.Mesh(new THREE.SphereGeometry(0.33, 10, 10), zombieHeadMat);
  h.position.y = 1.75; h.castShadow = true; g.add(h);

  const angle = Math.random() * Math.PI * 2;
  const r = 28 + Math.random() * 15;
  g.position.set(Math.cos(angle)*r, 0, Math.sin(angle)*r);
  scene.add(g);
  zombies.push({ mesh: g, hp: 30, speed: 1.5 + Math.random()*1.8 });
}

// ---------- KANCA ----------
let hookState = 'idle'; // idle | flying | attached
let hookPos = new THREE.Vector3();
let hookTarget = new THREE.Vector3();
const hookLine = new THREE.Line(
  new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]),
  new THREE.LineBasicMaterial({ color: 0xffdd00 })
);
hookLine.visible = false;
scene.add(hookLine);

const raycaster = new THREE.Raycaster();

function throwHook() {
  if (hookState !== 'idle') return;
  // Bakış yönünde binaya ışın at
  const dir = new THREE.Vector3(Math.sin(player.yaw), 0.3, Math.cos(player.yaw)).normalize();
  raycaster.set(player.pos.clone().add(new THREE.Vector3(0, 2, 0)), dir);
  raycaster.far = 40;
  const hits = raycaster.intersectObjects(buildings);
  if (hits.length > 0) {
    hookTarget.copy(hits[0].point);
    hookState = 'attached';
    hookPos.copy(hits[0].point);
    hookLine.visible = true;
    hookLine.geometry.setFromPoints([
      new THREE.Vector3(player.pos.x, 2, player.pos.z),
      hookPos
    ]);
  }
}

function releaseHook() {
  hookState = 'idle';
  hookLine.visible = false;
}

// ---------- ATEŞ ----------
const bullets = [];
let score = 0;

function shoot() {
  const dir = new THREE.Vector3(
    Math.sin(player.yaw) * Math.cos(player.pitch),
    Math.sin(player.pitch),
    Math.cos(player.yaw) * Math.cos(player.pitch)
  ).normalize();

  const b = new THREE.Mesh(
    new THREE.SphereGeometry(0.1, 4, 4),
    new THREE.MeshBasicMaterial({ color: 0xffff00 })
  );
  b.position.copy(player.pos).add(new THREE.Vector3(0, 1.5, 0));
  scene.add(b);
  bullets.push({ mesh: b, dir, life: 1.2, speed: 70 });

  // İsabet kontrolü (hitscan)
  raycaster.set(player.pos.clone().add(new THREE.Vector3(0, 1.5, 0)), dir);
  raycaster.far = 60;
  const hits = raycaster.intersectObjects(zombies.map(z => z.mesh), true);
  if (hits.length > 0) {
    // Grup içinden zombi bul
    let hitObj = hits[0].object;
    while (hitObj.parent && !zombies.find(z => z.mesh === hitObj)) {
      hitObj = hitObj.parent;
    }
    const z = zombies.find(zz => zz.mesh === hitObj);
    if (z) {
      z.hp -= 15;
      if (z.hp <= 0) {
        scene.remove(z.mesh);
        zombies.splice(zombies.indexOf(z), 1);
        score += 10;
        document.getElementById('score').textContent = score;
      }
    }
  }
}

// ---------- DOKUNMATİK KONTROL ----------
// Joystick
const joyBase = document.getElementById('joyBase');
const joyKnob = document.getElementById('joyKnob');
let joyId = null;
let joyStart = new THREE.Vector2();
let joyVec = new THREE.Vector2(); // -1..1

function joyCenter() {
  const r = joyBase.getBoundingClientRect();
  return new THREE.Vector2(r.left + r.width/2, r.top + r.height/2);
}

joyBase.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  joyId = t.identifier;
  joyStart.set(t.clientX, t.clientY);
});
joyBase.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === joyId) {
      const c = joyCenter();
      let dx = t.clientX - c.x;
      let dy = t.clientY - c.y;
      const max = 50;
      const len = Math.hypot(dx, dy);
      if (len > max) { dx = dx/len*max; dy = dy/len*max; }
      joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
      joyVec.set(dx/max, dy/max);
    }
  }
});
function joyEnd(e) {
  for (const t of e.changedTouches) {
    if (t.identifier === joyId) {
      joyId = null;
      joyVec.set(0, 0);
      joyKnob.style.transform = 'translate(0,0)';
    }
  }
}
joyBase.addEventListener('touchend', joyEnd);
joyBase.addEventListener('touchcancel', joyEnd);

// Sağ taraf bakış (ekranın sağ yarısı, joystick/buton dışı)
let lookId = null;
let lookLast = new THREE.Vector2();
document.body.addEventListener('touchstart', e => {
  for (const t of e.changedTouches) {
    if (t.target === document.body || t.target === renderer.domElement) {
      if (t.clientX > innerWidth / 2 && lookId === null) {
        lookId = t.identifier;
        lookLast.set(t.clientX, t.clientY);
      }
    }
  }
}, { passive: false });

document.body.addEventListener('touchmove', e => {
  for (const t of e.changedTouches) {
    if (t.identifier === lookId) {
      const dx = t.clientX - lookLast.x;
      const dy = t.clientY - lookLast.y;
      player.yaw -= dx * 0.005;
      player.pitch -= dy * 0.005;
      player.pitch = Math.max(-0.8, Math.min(0.8, player.pitch));
      lookLast.set(t.clientX, t.clientY);
    }
  }
}, { passive: false });

document.body.addEventListener('touchend', e => {
  for (const t of e.changedTouches) {
    if (t.identifier === lookId) lookId = null;
  }
});

// Ateş butonu
const fireBtn = document.getElementById('fireBtn');
let firing = false;
fireBtn.addEventListener('touchstart', e => { e.preventDefault(); firing = true; });
fireBtn.addEventListener('touchend', e => { e.preventDefault(); firing = false; });
fireBtn.addEventListener('touchcancel', () => firing = false);

// Kanca butonu
const hookBtn = document.getElementById('hookBtn');
hookBtn.addEventListener('touchstart', e => {
  e.preventDefault();
  if (hookState === 'idle') throwHook();
  else releaseHook();
});

// ---------- OYUN DÖNGÜSÜ ----------
let running = false;
let spawnTimer = 0;
let shootCooldown = 0;
const clock = new THREE.Clock();
const gravity = -30;

function update(dt) {
  // Hareket (joystick)
  const forward = new THREE.Vector3(Math.sin(player.yaw), 0, Math.cos(player.yaw));
  const right = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));
  const move = new THREE.Vector3();
  move.addScaledVector(forward, -joyVec.y);
  move.addScaledVector(right, joyVec.x);
  if (move.length() > 0) move.normalize();

  const newPos = player.pos.clone().addScaledVector(move, player.speed * dt);

  // Çarpışma
  let blocked = false;
  for (const b of buildings) {
    const s = b.userData.size;
    if (Math.abs(newPos.x - b.position.x) < s.x/2 + 0.4 &&
        Math.abs(newPos.z - b.position.z) < s.z/2 + 0.4 &&
        player.pos.y < s.y) {
      blocked = true; break;
    }
  }
  if (!blocked) player.pos.x = newPos.x, player.pos.z = newPos.z;

  // Kanca çekişi
  if (hookState === 'attached') {
    const toHook = new THREE.Vector3().subVectors(hookTarget, player.pos.clone().add(new THREE.Vector3(0,1,0)));
    const dist = toHook.length();
    if (dist > 2) {
      toHook.normalize();
      player.pos.addScaledVector(toHook, 18 * dt);
      player.velY = Math.max(player.velY, toHook.y * 10);
    } else {
      releaseHook();
    }
  }

  // Yerçekimi + zıplama yok (basit)
  player.velY += gravity * dt;
  player.pos.y += player.velY * dt;
  if (player.pos.y <= 0) { player.pos.y = 0; player.velY = 0; }

  // Oyuncu mesh
  playerMesh.position.copy(player.pos);
  playerMesh.rotation.y = player.yaw;
  // Silah yönü
  gunMesh.rotation.x = player.pitch;

  // Kamera (3. şahıs, omuz üstü)
  const camOffset = new THREE.Vector3(
    -Math.sin(player.yaw) * 4.5,
    3.2,
    -Math.cos(player.yaw) * 4.5
  );
  camera.position.copy(player.pos).add(camOffset);
  camera.lookAt(
    player.pos.x + Math.sin(player.yaw) * 10,
    player.pos.y + 2 + Math.sin(player.pitch) * 8,
    player.pos.z + Math.cos(player.yaw) * 10
  );

  // Kanca çizgisi
  if (hookState === 'attached') {
    hookLine.geometry.setFromPoints([
      new THREE.Vector3(player.pos.x, player.pos.y + 2, player.pos.z),
      hookPos
    ]);
  }

  // Ateş
  shootCooldown -= dt;
  if (firing && shootCooldown <= 0) {
    shoot();
    shootCooldown = 0.18;
  }

  // Mermiler
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.mesh.position.addScaledVector(b.dir, b.speed * dt);
    b.life -= dt;
    if (b.life <= 0) { scene.remove(b.mesh); bullets.splice(i, 1); }
  }

  // Zombiler
  for (const z of zombies) {
    const dir = new THREE.Vector3().subVectors(player.pos, z.mesh.position);
    dir.y = 0;
    const dist = dir.length();
    if (dist > 0.1) {
      dir.normalize();
      z.mesh.position.addScaledVector(dir, z.speed * dt);
      z.mesh.lookAt(player.pos.x, 0, player.pos.z);
    }
    if (dist < 1.5) {
      player.hp -= 20 * dt;
      document.getElementById('hp').textContent = Math.max(0, Math.floor(player.hp));
      if (player.hp <= 0) endGame();
    }
  }

  // Spawn
  spawnTimer -= dt;
  if (spawnTimer <= 0 && zombies.length < 15) {
    spawnZombie();
    spawnTimer = 1.5;
  }
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (running) update(dt);
  renderer.render(scene, camera);
}

function startGame() {
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('gameOver').style.display = 'none';
  player.hp = 100;
  player.pos.set(0, 0, 0);
  player.yaw = 0; player.pitch = 0; player.velY = 0;
  score = 0;
  document.getElementById('hp').textContent = 100;
  document.getElementById('score').textContent = 0;
  zombies.forEach(z => scene.remove(z.mesh)); zombies.length = 0;
  bullets.forEach(b => scene.remove(b.mesh)); bullets.length = 0;
  releaseHook();
  running = true;
  clock.getDelta();
}

function endGame() {
  running = false;
  document.getElementById('finalScore').textContent = score;
  document.getElementById('gameOver').style.display = 'flex';
}

document.getElementById('startBtn').onclick = startGame;
document.getElementById('restartBtn').onclick = startGame;

animate();
</script>
</body>
  </html>
