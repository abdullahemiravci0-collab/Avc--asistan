<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avcı - Genel Asistan</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

    <!-- Üst Başlık & İzin/İmza Alanı -->
    <header class="flex items-center justify-between px-4 py-3 bg-slate-900 border-b border-slate-800 text-xs text-slate-300">
        <div class="flex items-center gap-2">
            <span class="font-mono text-indigo-400 uppercase font-semibold text-[12px] tracking-wider">
                AVCI - GENEL ASİSTAN
            </span>
        </div>
        <div class="text-[10px] text-slate-500 font-mono">
            VERIFIED APP
        </div>
    </header>

    <!-- Ana İçerik / AI Ekranı -->
    <main class="flex-1 flex flex-col items-center justify-center p-4 text-center">
        <div class="max-w-md w-full bg-slate-900/95 p-6 rounded-xl border border-slate-800 shadow-xl">
            <h1 class="text-xl font-bold text-slate-100 mb-2">Avcı AI Asistanı Çalışıyor</h1>
            <p class="text-slate-400 text-sm mb-4">Google AI Studio altyapısı ile oluşturulmuştur.</p>
            <div class="p-3 bg-slate-950 rounded-lg border border-slate-800 text-left text-xs font-mono text-indigo-300">
                > Sistem hazır.<br>
                > Avcı-Genel Asistan bağlandı.
            </div>
        </div>
    </main>

    <!-- GitHub Alt İmza (Signature) -->
    <footer class="px-4 py-2 bg-slate-900 border-t border-slate-800 text-[11px] text-slate-400 text-center">
        Geliştirici İmza: <span class="text-indigo-400 font-semibold">Avcı-Genel Asistan</span>
    </footer>

</body>
</html>
