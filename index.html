<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avcı AI Kod Motoru</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-2 sm:p-4">

  <!-- Main Code Box -->
  <div class="w-full max-w-3xl rounded-lg border border-slate-800 bg-slate-950 overflow-hidden shadow-xl flex flex-col">
    
    <!-- Header Controls -->
    <div class="flex items-center justify-between px-3 py-2 bg-slate-900 border-b border-slate-800 text-xs">
      <span id="langDisplay" class="font-mono text-slate-300 uppercase font-semibold text-[11px] tracking-wider">JAVASCRIPT</span>
      
      <div class="flex items-center gap-1">
        <!-- Word Wrap Toggle -->
        <button
          type="button"
          id="wrapBtn"
          onclick="toggleWordWrap()"
          class="px-2 py-1 rounded text-[10px] sm:text-[11px] font-medium transition text-slate-400 hover:text-slate-200 hover:bg-slate-800"
        >
          <span id="wrapText">Kaydırma</span>
        </button>

        <!-- Fullscreen / Expand Toggle -->
        <button
          type="button"
          id="expandBtn"
          onclick="toggleExpand()"
          class="px-2 py-1 rounded text-[10px] sm:text-[11px] font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800 transition"
        >
          <span id="expandText">Genişlet</span>
        </button>

        <!-- Copy Button -->
        <button
          type="button"
          id="copyBtn"
          onclick="handleCopy()"
          class="px-2 py-1 rounded text-[10px] sm:text-[11px] font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800 transition"
        >
          <span id="copyText">Kopyala</span>
        </button>
      </div>
    </div>

    <!-- Code Body Container -->
    <div
      id="codeContainer"
      class="p-3 text-xs font-mono leading-relaxed text-slate-100 selection:bg-indigo-500/40 selection:text-white transition-all max-h-48 overflow-y-auto overflow-x-auto"
    >
      <pre id="preBlock" class="m-0 p-0 font-mono whitespace-pre"><code id="codeBlock" class="block tracking-normal">console.log("Avcı AI Kod Motoru Başarıyla Çalıştı!");</code></pre>
    </div>

    <!-- Code Footer Quick Info -->
    <div class="px-3 py-1.5 bg-slate-950 border-t border-slate-900 text-[10px] text-slate-400 flex items-center justify-between font-mono">
      <span>UTF-8 • <span id="footerLang">JAVASCRIPT</span></span>
      <span>Avcı AI Kod Motoru v0.3</span>
    </div>

  </div>

  <script>
    let isWrapped = false;
    let isExpanded = false;

    function toggleWordWrap() {
      isWrapped = !isWrapped;
      const pre = document.getElementById("preBlock");
      const wrapBtn = document.getElementById("wrapBtn");
      const wrapText = document.getElementById("wrapText");

      if (isWrapped) {
        pre.className = "m-0 p-0 font-mono whitespace-pre-wrap break-words";
        wrapBtn.className = "px-2 py-1 rounded text-[10px] sm:text-[11px] font-medium transition bg-indigo-600/30 text-indigo-300 border border-indigo-500/40";
        wrapText.innerText = "Kaydırma Açık";
      } else {
        pre.className = "m-0 p-0 font-mono whitespace-pre";
        wrapBtn.className = "px-2 py-1 rounded text-[10px] sm:text-[11px] font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800 transition";
        wrapText.innerText = "Kaydırma";
      }
    }

    function toggleExpand() {
      isExpanded = !isExpanded;
      const container = document.getElementById("codeContainer");
      const expandText = document.getElementById("expandText");

      if (isExpanded) {
        container.classList.remove("max-h-48", "overflow-y-auto");
        container.classList.add("max-h-none");
        expandText.innerText = "Daralt";
      } else {
        container.classList.remove("max-h-none");
        container.classList.add("max-h-48", "overflow-y-auto");
        expandText.innerText = "Genişlet";
      }
    }

    function handleCopy() {
      const code = document.getElementById("codeBlock").innerText;
      navigator.clipboard.writeText(code);
      const copyText = document.getElementById("copyText");
      copyText.innerText = "Kopyalandı";
      copyText.classList.add("text-green-400");
      setTimeout(() => {
        copyText.innerText = "Kopyala";
        copyText.classList.remove("text-green-400");
      }, 2000);
    }
  </script>
</body>
</html>
