<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avcı AI Asistan</title>
    <!-- Tailwind CSS (Görsel tasarım için) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-xl rounded-lg border border-slate-800 bg-slate-950 overflow-hidden shadow-xl flex flex-col">
        <!-- Header -->
        <div class="px-3 py-2 bg-slate-900 border-b border-slate-800 flex items-center justify-between gap-2">
            <span class="font-mono text-slate-200 uppercase font-semibold text-[11px] tracking-wider">JAVASCRIPT</span>
            <div class="flex items-center gap-1.5">
                <button onclick="toggleCopy()" id="copyBtn" class="px-2 py-1 rounded-md text-[11px] font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800 transition">
                    Kopyala
                </button>
            </div>
        </div>

        {/* Code Body */}
        <div class="p-4 text-xs font-mono leading-relaxed text-slate-100 max-h-56 overflow-y-auto overflow-x-auto">
            <pre class="m-0 p-0 font-mono whitespace-pre"><code id="codeContent">console.log("Avcı AI Kod Motoru Çalışıyor!");</code></pre>
        </div>

        {/* Footer */}
        <div class="px-3.5 py-1.5 bg-slate-950 border-t border-slate-900 text-[10px] text-slate-400 flex items-center justify-between font-mono">
            <span>UTF-8 • JAVASCRIPT</span>
            <span>Avcı AI Kod Motoru v0.3</span>
        </div>
    </div>

    <script>
        function toggleCopy() {
            const text = document.getElementById("codeContent").innerText;
            navigator.clipboard.writeText(text);
            const btn = document.getElementById("copyBtn");
            btn.innerText = "✓ Kopyalandı";
            btn.classList.add("text-green-400");
            setTimeout(() => {
                btn.innerText = "Kopyala";
                btn.classList.remove("text-green-400");
            }, 2000);
        }
    </script>
</body>
</html>
