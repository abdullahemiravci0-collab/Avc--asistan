<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ya Öl Ya Öldür</title>
<style>
  body { margin: 0; overflow: hidden; background: #000; font-family: Arial, sans-serif; }
  #hud {
    position: fixed; top: 10px; left: 10px; color: #fff;
    font-size: 18px; text-shadow: 2px 2px 4px #000; z-index: 10; pointer-events: none;
  }
  #crosshair {
    position: fixed; top: 50%; left: 50%; width: 20px; height: 20px;
    margin: -10px 0 0 -10px; border: 2px solid #fff; border-radius: 50%;
    z-index: 10; pointer-events: none; opacity: 0.7;
  }
  #startScreen {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85); color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 100; text-align: center; padding: 20px;
  }
  #startScreen h1 { color: #e33; font-size: 48px; margin: 0 0 10px; }
  #startScreen p { max-width: 500px; line-height: 1.6; color: #ccc; }
  #startBtn {
    margin-top: 20px; padding: 15px 40px; font-size: 20px; background: #e33;
    color: #fff; border: none; border-radius: 8px; cursor: pointer;
  }
  #startBtn:hover { background: #c22; }
  #gameOver {
    position: fixed; inset: 0; background: rgba(0,0,0,0.9); color: #fff;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    z-index: 100;
  }
  #gameOver h1 { color: #e33; font-size: 56px; }
</style>
</head>
<body>

<div id="hud">
  ❤️ Can: <span id="hp">100</span> | 💀 Skor: <span id="score">0</span>
</div>
<div id="crosshair"></div>

<div id="startScreen">
  <h1>YA ÖL YA ÖLDÜR</h1>
  <p>
    WASD = hareket &nbsp;|&nbsp; Mouse = bak &nbsp;|&nbsp; Sol tık = ateş<br>
    Zombileri vur, hayatta kal!
  </p>
  <button id="startBtn">OYUNA BAŞLA</button>
</div>

<div id="gameOver">
  <h1>ÖLDÜN</h1>
  <p>Skor: <span id="finalScore">0</span></p>
  <button id="startBtn2" style="padding:15px 40px;font-size:20px;background:#e33;color:#fff;border:none;border-radius:8px;cursor:pointer;">TEKRAR DENE</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ---------- SAHNE ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
scene.fog = new THREE.Fog(0x1a1a2e, 20, 80);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 200);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- IŞIK ----------
scene.add(new THREE.AmbientLight(0xffffff, 0.4));
const moon = new THREE.DirectionalLight(0x8899ff, 0.8);
moon.position.set(10, 20, 10);
moon.castShadow = true;
moon.shadow.mapSize.set(1024, 1024);
moon.shadow.camera.left = -50;
moon.shadow.camera.right = 50;
moon.shadow.camera.top = 50;
moon.shadow.camera.bottom = -50;
scene.add(moon);

// ---------- ZEMİN ----------
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(100, 100),
  new THREE.MeshStandardMaterial({ color: 0x223322 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// ---------- BİNALAR ----------
const buildings = [];
const buildingMat = new THREE.MeshStandardMaterial({ color: 0x444455 });
for (let i = 0; i < 12; i++) {
  const w = 3 + Math.random()*4;
  const h = 5 + Math.random()*10;
  const d = 3 + Math.random()*4;
  const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), buildingMat);
  const angle = Math.random() * Math.PI * 2;
  const r = 12 + Math.random() * 25;
  b.position.set(Math.cos(angle)*r, h/2, Math.sin(angle)*r);
  b.castShadow = true;
  b.receiveShadow = true;
  scene.add(b);
  buildings.push(b);
}

// ---------- OYUNCU ----------
const player = {
  pos: new THREE.Vector3(0, 1.7, 0),
  yaw: 0,
  pitch: 0,
  hp: 100,
  speed: 8
};

// ---------- SİLAH (kamera önünde) ----------
const gun = new THREE.Mesh(
  new THREE.BoxGeometry(0.15, 0.15, 0.8),
  new THREE.MeshStandardMaterial({ color: 0x222222 })
);
gun.position.set(0.3, -0.25, -0.6);
camera.add(gun);
scene.add(camera);

// ---------- ZOMBİLER ----------
const zombies = [];
const zombieMat = new THREE.MeshStandardMaterial({ color: 0x2e8b2e });
function spawnZombie() {
  const z = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.8, 0.8), zombieMat);
  const angle = Math.random() * Math.PI * 2;
  const r = 25 + Math.random() * 15;
  z.position.set(Math.cos(angle)*r, 0.9, Math.sin(angle)*r);
  z.castShadow = true;
  scene.add(z);
  zombies.push({ mesh: z, hp: 30, speed: 1.5 + Math.random()*1.5 });
}

// ---------- ATEŞ ----------
const raycaster = new THREE.Raycaster();
const bullets = [];

function shoot() {
  // Muzzle flash / iz
  const geo = new THREE.SphereGeometry(0.05, 4, 4);
  const mat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
  const b = new THREE.Mesh(geo, mat);
  b.position.copy(player.pos);
  scene.add(b);
  bullets.push({ mesh: b, dir: getLookDir(), life: 1.5, speed: 60 });

  // Zombi isabet kontrolü
  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
  raycaster.far = 60;
  const hits = raycaster.intersectObjects(zombies.map(z => z.mesh));
  if (hits.length > 0) {
    const hitMesh = hits[0].object;
    const z = zombies.find(zz => zz.mesh === hitMesh);
    if (z) {
      z.hp -= 15;
      if (z.hp <= 0) {
        scene.remove(z.mesh);
        zombies.splice(zombies.indexOf(z), 1);
        score += 10;
        document.getElementById('score').textContent = score;
      }
    }
  }
}

function getLookDir() {
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  return dir;
}

// ---------- KONTROL ----------
const keys = {};
addEventListener('keydown', e => keys[e.code] = true);
addEventListener('keyup', e => keys[e.code] = false);

let mouseDown = false;
document.addEventListener('mousedown', e => { if (e.button === 0) mouseDown = true; });
document.addEventListener('mouseup', e => { if (e.button === 0) mouseDown = false; });

let pointerLocked = false;
document.addEventListener('pointerlockchange', () => {
  pointerLocked = document.pointerLockElement === renderer.domElement;
});
document.addEventListener('mousemove', e => {
  if (!pointerLocked) return;
  player.yaw -= e.movementX * 0.002;
  player.pitch -= e.movementY * 0.002;
  player.pitch = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, player.pitch));
});

// ---------- OYUN DÖNGÜSÜ ----------
let running = false;
let score = 0;
let spawnTimer = 0;
let shootCooldown = 0;
const clock = new THREE.Clock();

function update(dt) {
  // Hareket
  const forward = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
  const right = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));
  const move = new THREE.Vector3();
  if (keys['KeyW']) move.add(forward);
  if (keys['KeyS']) move.sub(forward);
  if (keys['KeyD']) move.add(right);
  if (keys['KeyA']) move.sub(right);
  if (move.length() > 0) move.normalize();

  const newPos = player.pos.clone().addScaledVector(move, player.speed * dt);

  // Bina çarpışması (basit AABB)
  let blocked = false;
  for (const b of buildings) {
    const half = new THREE.Vector3();
    b.geometry.computeBoundingBox();
    b.geometry.boundingBox.getSize(half);
    half.multiplyScalar(0.5);
    half.x += 0.4; half.z += 0.4;
    if (Math.abs(newPos.x - b.position.x) < half.x &&
        Math.abs(newPos.z - b.position.z) < half.z) {
      blocked = true; break;
    }
  }
  if (!blocked) player.pos.copy(newPos);

  // Kamera
  camera.position.copy(player.pos);
  camera.rotation.order = 'YXZ';
  camera.rotation.y = player.yaw;
  camera.rotation.x = player.pitch;

  // Ateş
  shootCooldown -= dt;
  if (mouseDown && shootCooldown <= 0 && pointerLocked) {
    shoot();
    shootCooldown = 0.15;
  }

  // Mermiler
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.mesh.position.addScaledVector(b.dir, b.speed * dt);
    b.life -= dt;
    if (b.life <= 0) {
      scene.remove(b.mesh);
      bullets.splice(i, 1);
    }
  }

  // Zombiler
  for (const z of zombies) {
    const dir = new THREE.Vector3().subVectors(player.pos, z.mesh.position);
    dir.y = 0;
    const dist = dir.length();
    if (dist > 0.1) {
      dir.normalize();
      z.mesh.position.addScaledVector(dir, z.speed * dt);
      z.mesh.lookAt(player.pos.x, 0.9, player.pos.z);
    }
    // Saldırı
    if (dist < 1.5) {
      player.hp -= 20 * dt;
      document.getElementById('hp').textContent = Math.max(0, Math.floor(player.hp));
      if (player.hp <= 0) endGame();
    }
  }

  // Zombi spawn
  spawnTimer -= dt;
  if (spawnTimer <= 0 && zombies.length < 15) {
    spawnZombie();
    spawnTimer = 1.5;
  }
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (running) update(dt);
  renderer.render(scene, camera);
}

// ---------- BAŞLAT / BİTİR ----------
function startGame() {
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('gameOver').style.display = 'none';
  // Reset
  player.hp = 100;
  player.pos.set(0, 1.7, 0);
  player.yaw = 0; player.pitch = 0;
  score = 0;
  document.getElementById('hp').textContent = 100;
  document.getElementById('score').textContent = 0;
  zombies.forEach(z => scene.remove(z.mesh));
  zombies.length = 0;
  bullets.forEach(b => scene.remove(b.mesh));
  bullets.length = 0;
  running = true;
  renderer.domElement.requestPointerLock();
  clock.getDelta();
}

function endGame() {
  running = false;
  document.getElementById('finalScore').textContent = score;
  document.getElementById('gameOver').style.display = 'flex';
  document.exitPointerLock();
}

document.getElementById('startBtn').onclick = startGame;
document.getElementById('startBtn2').onclick = startGame;

animate();
</script>
</body>
                                              </html>
