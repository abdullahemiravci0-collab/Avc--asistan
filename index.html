<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ya Öl Ya Öldür - PC</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow: hidden; background: #000; font-family: Arial, sans-serif; }
  canvas { display: block; }

  #errorBox {
    position: fixed; top: 0; left: 0; right: 0; background: #900; color: #fff;
    padding: 10px; font-size: 13px; z-index: 999; display: none; word-break: break-all;
  }

  #hud {
    position: fixed; top: 10px; left: 10px; color: #fff;
    font-size: 18px; text-shadow: 2px 2px 4px #000; z-index: 10; pointer-events: none;
  }

  #crosshair {
    position: fixed; top: 50%; left: 50%; width: 20px; height: 20px;
    margin: -10px 0 0 -10px; border: 2px solid #fff; border-radius: 50%;
    z-index: 10; pointer-events: none; opacity: 0.7;
  }

  #startScreen {
    position: fixed; inset: 0; background: rgba(0,0,0,0.9); color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 100; text-align: center; padding: 20px;
  }
  #startScreen h1 { color: #e33; font-size: 48px; margin: 0 0 10px; }
  #startScreen p { max-width: 500px; line-height: 1.8; color: #ccc; font-size: 16px; }
  #startBtn {
    margin-top: 25px; padding: 15px 50px; font-size: 20px; background: #e33;
    color: #fff; border: none; border-radius: 8px; cursor: pointer;
  }
  #startBtn:hover { background: #c22; }

  #gameOver {
    position: fixed; inset: 0; background: rgba(0,0,0,0.92); color: #fff;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    z-index: 100;
  }
  #gameOver h1 { color: #e33; font-size: 56px; }
  #restartBtn {
    padding: 15px 50px; font-size: 20px; background: #e33; color: #fff;
    border: none; border-radius: 8px; margin-top: 20px; cursor: pointer;
  }
  #restartBtn:hover { background: #c22; }
</style>
</head>
<body>

<div id="errorBox"></div>
<div id="hud">❤️ <span id="hp">100</span> | 💀 <span id="score">0</span></div>
<div id="crosshair"></div>

<div id="startScreen">
  <h1>YA ÖL YA ÖLDÜR</h1>
  <p>
    <b>WASD</b> = hareket &nbsp;|&nbsp; <b>Mouse</b> = bakın<br>
    <b>Sol tık</b> = ateş &nbsp;|&nbsp; <b>F</b> = kanca (binaya tutun, uç)<br>
    <b>ESC</b> = mouse'u serbest bırak
  </p>
  <button id="startBtn">OYUNA BAŞLA</button>
</div>

<div id="gameOver">
  <h1>ÖLDÜN</h1>
  <p>Skor: <span id="finalScore">0</span></p>
  <button id="restartBtn">TEKRAR DENE</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
window.addEventListener('error', e => {
  const box = document.getElementById('errorBox');
  box.style.display = 'block';
  box.textContent = 'HATA: ' + (e.message || e.error);
});

import * as THREE from 'three';

// ---------- SAHNE ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
scene.fog = new THREE.Fog(0x1a1a2e, 25, 90);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 300);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- IŞIK ----------
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const sun = new THREE.DirectionalLight(0x99aaff, 0.9);
sun.position.set(15, 25, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -50;
sun.shadow.camera.right = 50;
sun.shadow.camera.top = 50;
sun.shadow.camera.bottom = -50;
scene.add(sun);

// ---------- ZEMİN ----------
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(120, 120),
  new THREE.MeshStandardMaterial({ color: 0x223322 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// ---------- BİNALAR ----------
const buildings = [];
const buildingMat = new THREE.MeshStandardMaterial({ color: 0x444455 });
for (let i = 0; i < 14; i++) {
  const w = 3 + Math.random()*4;
  const h = 5 + Math.random()*12;
  const d = 3 + Math.random()*4;
  const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), buildingMat);
  const angle = Math.random() * Math.PI * 2;
  const r = 12 + Math.random() * 30;
  b.position.set(Math.cos(angle)*r, h/2, Math.sin(angle)*r);
  b.castShadow = true;
  b.receiveShadow = true;
  b.userData.size = new THREE.Vector3(w, h, d);
  scene.add(b);
  buildings.push(b);
}

// ---------- OYUNCU ----------
const player = {
  pos: new THREE.Vector3(0, 1.7, 0),
  yaw: 0,
  pitch: 0,
  hp: 100,
  velY: 0,
  speed: 8
};

// ---------- SİLAH (kamera önünde) ----------
const gun = new THREE.Mesh(
  new THREE.BoxGeometry(0.15, 0.15, 0.8),
  new THREE.MeshStandardMaterial({ color: 0x222222 })
);
gun.position.set(0.3, -0.25, -0.6);
camera.add(gun);
scene.add(camera);

// ---------- ZOMBİLER ----------
const zombies = [];
const zombieBodyMat = new THREE.MeshStandardMaterial({ color: 0x2e8b2e });
const zombieHeadMat = new THREE.MeshStandardMaterial({ color: 0x3fa03f });

function spawnZombie() {
  const g = new THREE.Group();
  const b = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.2, 0.5), zombieBodyMat);
  b.position.y = 0.9; b.castShadow = true; g.add(b);
  const h = new THREE.Mesh(new THREE.SphereGeometry(0.33, 10, 10), zombieHeadMat);
  h.position.y = 1.75; h.castShadow = true; g.add(h);

  const angle = Math.random() * Math.PI * 2;
  const r = 28 + Math.random() * 15;
  g.position.set(Math.cos(angle)*r, 0, Math.sin(angle)*r);
  scene.add(g);
  zombies.push({ mesh: g, hp: 30, speed: 1.5 + Math.random()*1.8 });
}

// ---------- KANCA ----------
let hookState = 'idle';
let hookPos = new THREE.Vector3();
let hookTarget = new THREE.Vector3();
const hookLine = new THREE.Line(
  new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]),
  new THREE.LineBasicMaterial({ color: 0xffdd00 })
);
hookLine.visible = false;
scene.add(hookLine);

const raycaster = new THREE.Raycaster();

function throwHook() {
  if (hookState !== 'idle') return;
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  raycaster.set(player.pos, dir);
  raycaster.far = 50;
  const hits = raycaster.intersectObjects(buildings);
  if (hits.length > 0) {
    hookTarget.copy(hits[0].point);
    hookState = 'attached';
    hookPos.copy(hits[0].point);
    hookLine.visible = true;
  }
}

function releaseHook() {
  hookState = 'idle';
  hookLine.visible = false;
}

// ---------- ATEŞ ----------
const bullets = [];
let score = 0;

function shoot() {
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);

  const b = new THREE.Mesh(
    new THREE.SphereGeometry(0.08, 4, 4),
    new THREE.MeshBasicMaterial({ color: 0xffff00 })
  );
  b.position.copy(player.pos);
  scene.add(b);
  bullets.push({ mesh: b, dir: dir.clone(), life: 1.2, speed: 80 });

  raycaster.set(player.pos, dir);
  raycaster.far = 80;
  const hits = raycaster.intersectObjects(zombies.map(z => z.mesh), true);
  if (hits.length > 0) {
    let hitObj = hits[0].object;
    while (hitObj.parent && !zombies.find(z => z.mesh === hitObj)) {
      hitObj = hitObj.parent;
    }
    const z = zombies.find(zz => zz.mesh === hitObj);
    if (z) {
      z.hp -= 15;
      if (z.hp <= 0) {
        scene.remove(z.mesh);
        zombies.splice(zombies.indexOf(z), 1);
        score += 10;
        document.getElementById('score').textContent = score;
      }
    }
  }
}

// ---------- KONTROL ----------
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyF') {
    if (hookState === 'idle') throwHook();
    else releaseHook();
  }
});
addEventListener('keyup', e => keys[e.code] = false);

let mouseDown = false;
document.addEventListener('mousedown', e => { if (e.button === 0) mouseDown = true; });
document.addEventListener('mouseup', e => { if (e.button === 0) mouseDown = false; });

let pointerLocked = false;
document.addEventListener('pointerlockchange', () => {
  pointerLocked = document.pointerLockElement === renderer.domElement;
});
document.addEventListener('mousemove', e => {
  if (!pointerLocked) return;
  player.yaw -= e.movementX * 0.002;
  player.pitch -= e.movementY * 0.002;
  player.pitch = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, player.pitch));
});

// Tıklayınca pointer lock tekrar al (ESC sonrası)
renderer.domElement.addEventListener('click', () => {
  if (running && !pointerLocked) renderer.domElement.requestPointerLock();
});

// ---------- DÖNGÜ ----------
let running = false;
let spawnTimer = 0;
let shootCooldown = 0;
const clock = new THREE.Clock();
const gravity = -30;

function update(dt) {
  // Hareket
  const forward = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
  const right = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));
  const move = new THREE.Vector3();
  if (keys['KeyW']) move.add(forward);
  if (keys['KeyS']) move.sub(forward);
  if (keys['KeyD']) move.add(right);
  if (keys['KeyA']) move.sub(right);
  if (move.length() > 0) move.normalize();

  const newPos = player.pos.clone().addScaledVector(move, player.speed * dt);

  // Çarpışma
  let blocked = false;
  for (const b of buildings) {
    const s = b.userData.size;
    if (Math.abs(newPos.x - b.position.x) < s.x/2 + 0.4 &&
        Math.abs(newPos.z - b.position.z) < s.z/2 + 0.4 &&
        player.pos.y - 1.7 < s.y) {
      blocked = true; break;
    }
  }
  if (!blocked) { player.pos.x = newPos.x; player.pos.z = newPos.z; }

  // Kanca
  if (hookState === 'attached') {
    const toHook = new THREE.Vector3().subVectors(hookTarget, player.pos);
    const dist = toHook.length();
    if (dist > 2) {
      toHook.normalize();
      player.pos.addScaledVector(toHook, 20 * dt);
      player.velY = Math.max(player.velY, toHook.y * 12);
    } else {
      releaseHook();
    }
  }

  // Yerçekimi
  player.velY += gravity * dt;
  player.pos.y += player.velY * dt;
  if (player.pos.y < 1.7) { player.pos.y = 1.7; player.velY = 0; }

  // Kamera
  camera.position.copy(player.pos);
  camera.rotation.order = 'YXZ';
  camera.rotation.y = player.yaw;
  camera.rotation.x = player.pitch;

  // Kanca çizgisi
  if (hookState === 'attached') {
    hookLine.geometry.setFromPoints([player.pos.clone(), hookPos]);
  }

  // Ateş
  shootCooldown -= dt;
  if (mouseDown && shootCooldown <= 0 && pointerLocked) {
    shoot();
    shootCooldown = 0.15;
  }

  // Mermiler
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.mesh.position.addScaledVector(b.dir, b.speed * dt);
    b.life -= dt;
    if (b.life <= 0) { scene.remove(b.mesh); bullets.splice(i, 1); }
  }

  // Zombiler
  for (const z of zombies) {
    const dir = new THREE.Vector3().subVectors(player.pos, z.mesh.position);
    dir.y = 0;
    const dist = dir.length();
    if (dist > 0.1) {
      dir.normalize();
      z.mesh.position.addScaledVector(dir, z.speed * dt);
      z.mesh.lookAt(player.pos.x, 0.9, player.pos.z);
    }
    if (dist < 1.5) {
      player.hp -= 20 * dt;
      document.getElementById('hp').textContent = Math.max(0, Math.floor(player.hp));
      if (player.hp <= 0) endGame();
    }
  }

  // Spawn
  spawnTimer -= dt;
  if (spawnTimer <= 0 && zombies.length < 15) {
    spawnZombie();
    spawnTimer = 1.5;
  }
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (running) update(dt);
  renderer.render(scene, camera);
}

function startGame() {
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('gameOver').style.display = 'none';
  player.hp = 100;
  player.pos.set(0, 1.7, 0);
  player.yaw = 0; player.pitch = 0; player.velY = 0;
  score = 0;
  document.getElementById('hp').textContent = 100;
  document.getElementById('score').textContent = 0;
  zombies.forEach(z => scene.remove(z.mesh)); zombies.length = 0;
  bullets.forEach(b => scene.remove(b.mesh)); bullets.length = 0;
  releaseHook();
  running = true;
  renderer.domElement.requestPointerLock();
  clock.getDelta();
}

function endGame() {
  running = false;
  document.getElementById('finalScore').textContent = score;
  document.getElementById('gameOver').style.display = 'flex';
  document.exitPointerLock();
}

document.getElementById('startBtn').onclick = startGame;
document.getElementById('restartBtn').onclick = startGame;

animate();
</script>
</body>
</html>
